# lifeline-daemon configuration.
# Copy this file to ~/.config/lifeline/config.toml and edit it.
# Lists must fit on a single line.

[watch]
# Folders to keep an eye on. Start small: every change stores a full copy.
paths = ["~/Documents"]
# How often to look for changes (milliseconds)
poll_ms = 2000
# Wait until a file has been quiet this long before saving it (milliseconds)
settle_ms = 1000
# Save at most one version of each file per this many seconds
min_gap_s = 10

[ignore]
# File or folder names not worth remembering (* works at the start or end)
patterns = ["*.tmp", "*.swp", "*~", "node_modules", ".cache", "target", ".git"]

[storage]
# Skip files bigger than this (megabytes)
max_file_mb = 50
# Planned, not used yet: max_size_gb, keep_days
