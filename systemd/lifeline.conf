# UndoOS privileged control socket runtime directory.
# /run is recreated on every boot, so enforce safe traversal permissions.
d /run/lifeline 0711 root root -

# Reserved root-only storage for future system recovery evidence.
# The current service does not read from or write to this directory.
d /var/lib/lifeline 0700 root root -
d /var/lib/lifeline/system 0700 root root -
